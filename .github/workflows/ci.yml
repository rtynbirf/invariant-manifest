name: МАНИФЕСТ ИНВАРИАНТА · FORK 3

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"  # ежедневно: инвариант обязан держаться
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5
        with:
          python-version: "3.12"
      - name: прогон инварианта
        run: python3 run_all.py
      - name: мутационные тесты
        run: python3 test_mutations.py
